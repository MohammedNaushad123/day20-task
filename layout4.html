<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
       
        .dot4{
            display: flex;
            gap: 10px;
            margin: 10px;

        }
        .red{
            background-color: red;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .yellow{
            background-color: yellow;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .green{
            background-color: green;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .search{
            background-color: #fff;
            border-radius: 10px;
            width: 30px;
            height: 30px;
            flex: 1;
        }
        .container4{
            height: 90vh;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,1fr);
            gap: 10px;
        }
        .box1{
            background-color: rgba(255, 166, 0, 0.808);
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
        }
        .box2{
            background-color: mediumseagreen;
            grid-column-start: 3;
            grid-column-end: 5;
            grid-row-start: 1;
            grid-row-end: 2;
        }
        .box3{
            background-color: skyblue;
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 2;
        }
        .box4{
            background-color: skyblue;
            grid-column-start: 2;
            grid-column-end: 5;
            grid-row-start: 2;
            grid-row-end: 3;
        }
        .box5{
            background-color: rgba(255, 166, 0, 0.808);
            grid-column-start: 1;
            grid-column-end: 5;
        }
        #box{
            border-radius: 10px;
        }
    </style>
</head>
<body>
  
        <div class="dot4">
            <div class="red"></div>
            <div class="yellow"></div>
            <div class="green"></div>
            <div class="search"></div>
        </div>
      <div class="container4">
        <div class="box1" id="box"></div>
        <div class="box2" id="box"></div>
        <div class="box3" id="box"></div>
        <div class="box4" id="box"></div>
        <div class="box5" id="box"></div>
    </div>   
</body>
</html>
