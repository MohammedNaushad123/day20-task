<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:black;
        }
        .circle{
            display: flex;
            gap: 10px;
            margin: 10px;
        }
        .red{
            background-color: red;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .yellow{
            background-color: yellow;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .green{
            background-color: green;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }
        .search{
            background-color: #fff;
            border-radius: 10px;
            width: 30px;
            height: 30px;
            flex: 1;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows: repeat(3,1fr);
            height: 90vh;
            background-color: black;
            margin: 10px;
            gap: 10px;
            
        }
        .box1{
            background-color: tomato;
        }
        .box2{
            background-color: orange;
        }
        .box3{
            background-color: tomato;
        }
        .box4{
            background-color: orange;
        }
        .box5{
            background-color: skyblue;
        }
        .box6{
            background-color: orange;
        }
        .box7{
            background-color: orange;
        }
        .box8{
            background-color: tomato;
        }
        .box9{
            background-color: orange;
        }
        .box10{
            background-color: tomato;
        }
        .box11{
            background-color: orange;
        }
        .box12{
            background-color: tomato;
        }
        .box13{
            background-color: skyblue;
        }
        .box14{
            background-color: tomato;
        }
        .box15{
            background-color: skyblue;
        }
        .box16{
            background-color: orange;
        }
        .box17{
            background-color: skyblue;
        }
        .box18{
            background-color: skyblue;
        }
        #box{
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="circle">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
        <div class="search"></div>
    </div>
    <div class="container">
        <div class="box1" id="box"></div>
        <div class="box2" id="box"></div>
        <div class="box3" id="box"></div>
        <div class="box4" id="box"></div>
        <div class="box5" id="box"></div>
        <div class="box6" id="box"></div>
        <div class="box7" id="box"></div>
        <div class="box8" id="box"></div>
        <div class="box9" id="box"></div>
        <div class="box10" id="box"></div>
        <div class="box11" id="box"></div>
        <div class="box12" id="box"></div>
        <div class="box13" id="box"></div>
        <div class="box14" id="box"></div>
        <div class="box15" id="box"></div>
        <div class="box16" id="box"></div>
        <div class="box17" id="box"></div>
        <div class="box18" id="box"></div>
    </div>
</body>
</html>
